<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shamble VFX test page</title>
    <style>
      :root { color-scheme: dark; --bg: #16171d; --bar: #20222b; --line: #343744; --text: #e8e6df; --dim: #9a9aa3; --bad: #ff8a7a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--line); }
      header h1 { font-size: 13px; margin: 0 6px 0 0; font-weight: 600; }
      label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
      select, input, button { font: inherit; color: var(--text); background: #2b2e39; border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
      input[type='number'] { width: 4.5em; }
      button { cursor: pointer; padding: 3px 12px; }
      button.play { background: #3d5c3a; border-color: #557a50; }
      #stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
      #stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; object-fit: contain; }
      footer { padding: 6px 12px; background: var(--bar); border-top: 1px solid var(--line); color: var(--dim); font-variant-numeric: tabular-nums; white-space: pre-wrap; }
      footer.bad { color: var(--bad); }
    </style>
  </head>
  <body>
    <header>
      <h1>Shamble VFX test page</h1>
      <label>Export <select id="export"></select></label>
      <label>Game event <select id="event"></select></label>
      <button id="play" class="play">Play</button>
      <label><input id="repeat" type="checkbox" checked /> Repeat</label>
      <label>Tier <select id="tier"><option value="low">Low</option><option value="medium">Medium</option><option value="high" selected>High</option></select></label>
      <label>Faction that fired <select id="faction"></select></label>
      <label>Made by <select id="by"><option value="enemy">an enemy</option><option value="team">your team</option><option value="you">you</option></select></label>
      <label>Target <select id="height"><option value="0">on the ground</option><option value="1.1">on a soldier (1.1 m)</option></select></label>
      <label>Distance from you <input id="distance" type="number" min="0" max="30" step="1" value="4" /> m</label>
    </header>
    <div id="stage"></div>
    <footer id="status">Loading…</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
